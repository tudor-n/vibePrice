<x-dc>
<helmet>
<style>
  @keyframes bird-fly-a { 0% { transform: translate(0px,0px) rotate(0deg); opacity: 0; } 8% { opacity: .6; } 28% { transform: translate(150px,-26px) rotate(-6deg); } 52% { transform: translate(290px,-6px) rotate(5deg); } 78% { transform: translate(430px,-44px) rotate(-4deg); opacity: .6; } 100% { transform: translate(560px,-96px) rotate(-9deg); opacity: 0; } }
  @keyframes bird-fly-b { 0% { transform: translate(0px,0px) rotate(0deg); opacity: 0; } 10% { opacity: .55; } 32% { transform: translate(175px,-12px) rotate(5deg); } 58% { transform: translate(330px,-32px) rotate(-5deg); } 82% { transform: translate(470px,-8px) rotate(4deg); opacity: .55; } 100% { transform: translate(610px,-60px) rotate(6deg); opacity: 0; } }
  @keyframes bird-fly-c { 0% { transform: translate(0px,0px) rotate(0deg); opacity: 0; } 9% { opacity: .5; } 30% { transform: translate(140px,-36px) rotate(-5deg); } 56% { transform: translate(300px,-14px) rotate(6deg); } 84% { transform: translate(430px,-58px) rotate(-5deg); opacity: .5; } 100% { transform: translate(520px,-120px) rotate(-10deg); opacity: 0; } }
  @keyframes bird-flap-l { 0%,100% { transform: rotate(-14deg); } 44% { transform: rotate(16deg); } }
  @keyframes bird-flap-r { 0%,100% { transform: rotate(14deg); } 44% { transform: rotate(-16deg); } }
  @keyframes cloud-drift-a { 0% { transform: translateX(0); } 100% { transform: translateX(34px); } }
  @keyframes cloud-drift-b { 0% { transform: translateX(0); } 100% { transform: translateX(-28px); } }
</style>
</helmet>
<sc-if value="{{ isHero }}" hint-placeholder-val="{{ true }}">
