# Dev overrides: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# Mounts source for hot reload where practical; exposes Postgres for local tools.

services:
  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development

  dataplane:
    volumes:
      - ./dataplane/src:/app/src
    environment:
      SCHEDULER_ENABLED: "true"
      LOG_LEVEL: DEBUG

  web:
    # In dev, prefer running `npm run dev` on the host for real HMR.
    profiles: ["full"]
