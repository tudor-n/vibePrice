[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pricepilot"
version = "0.1.0"
description = "PricePilot dataplane: scrapers, public-data ingest, pricing engine, scheduler."
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3",
    "httpx",
    "beautifulsoup4",
    "apscheduler>=3.10",
    "pydantic-settings>=2",
    "holidays>=0.50",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

# The Docker image pip-installs from src/ only; the fixture places provider
# (default, PLACES_PROVIDER=fixture) reads these JSONs at runtime. Removing
# this stanza breaks resolve_place/discover_competitors in the container.
[tool.setuptools.package-data]
"pricepilot.places" = ["fixtures/*.json"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the dev PostgreSQL (docker compose up -d db + backend EF migrations); auto-skipped when unreachable",
]
